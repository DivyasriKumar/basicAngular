<!-- evidence-table.component.html -->
<table>
  <thead>
    <tr>
      <th>Source</th>
      <th>Evidence</th>
      <th>Timestamp</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of evidenceList">
      <td>{{ item.source }}</td>
      <td>{{ item.details }}</td>
      <td>{{ item.timestamp }}</td>
    </tr>
  </tbody>
</table>
