<div class="chat-wrapper">
  <section class="hero">
    <h1>An appealing, modern AI chatbot UI</h1>
    <p>NovaChat helps you draft, brainstorm, and explain anything beautifully.</p>
  </section>

  <div class="card">
    <div class="chat-shell">
      <app-chat-window [messages]="messages" [bottomOffset]="actionsHeight"></app-chat-window>
      <div class="actions" #actionsRef>
        <app-chat-input (messageSent)="handleSend($event)"></app-chat-input>
      </div>
    </div>
  </div>

  <div class="suggestions">
    <button *ngFor="let s of suggestions" class="suggestion" (click)="chooseSuggestion(s)">{{s}}</button>
  </div>
</div>
