<div class="query-box" role="region" aria-label="Message input">
  <textarea
    #txt
    [(ngModel)]="query"
    (input)="adjustHeight()"
    (keydown.enter)="$event.preventDefault(); submitQuery()"
    placeholder="Type your message..."
    rows="1"
    aria-label="Message"
  ></textarea>

  <button class="send" (click)="submitQuery()" aria-label="Send message">
    &#10148;
  </button>
</div>
